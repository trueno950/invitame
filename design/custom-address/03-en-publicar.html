<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dirección — en el panel Publicar</title>
<style>
  :root{--bg:#fff7f5;--surface:#fff;--rose-50:#fdeef2;--rose-100:#f8d7e0;--ink:#3b1424;--muted:#6b3a4c;--primary:#8c1c3a;--field-border:#a06e7e;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);padding:32px}
  main{max-width:640px;margin:0 auto}
  .panel{background:var(--surface);border-radius:20px;padding:20px;box-shadow:inset 0 0 0 1.5px var(--rose-100)}
  h2{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0 0 14px}
  .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .link{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 16px;padding:12px 14px;border-radius:14px;background:var(--rose-50)}
  .link b{font-size:15px}
  .link a{font-size:13px;font-weight:600;color:var(--primary)}
  .state{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--field-border);margin-bottom:12px}
  button{font:600 14px var(--font-sans);padding:11px 20px;border-radius:999px;border:0;background:var(--primary);color:#fff}
</style>
</head>
<body>
<main>
  <section class="panel">
    <h2>Publicar</h2>
    <span class="state">Borrador</span>
    <div class="k">Dirección pública</div>
    <div class="link"><b>invitame.mx/i/valentina-xv</b><a href="#">Cambiar</a></div>
    <button type="button">Publicar</button>
  </section>
</main>
</body>
</html>
