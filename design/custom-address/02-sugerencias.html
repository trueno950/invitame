<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dirección — sugerencias</title>
<style>
  :root{--bg:#fff7f5;--surface:#fff;--rose-50:#fdeef2;--rose-100:#f8d7e0;--ink:#3b1424;--muted:#6b3a4c;--primary:#8c1c3a;--field-border:#a06e7e;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);padding:32px}
  main{max-width:640px;margin:0 auto}
  h1{font-family:var(--font-display);font-weight:600;font-size:28px;margin:0 0 4px}
  .lead{color:var(--muted);margin:0 0 16px}
  .opt{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:inset 0 0 0 1.5px var(--rose-100)}
  .opt.on{box-shadow:inset 0 0 0 2px var(--primary);background:var(--rose-50)}
  .opt b{font-size:15px}.opt span{font-size:13px;color:var(--muted)}
  .dot{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--field-border);flex:none}
  .on .dot{box-shadow:inset 0 0 0 5px var(--primary)}
  .own{display:block;margin-top:6px;color:var(--primary);font-weight:600;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Elige tu dirección</h1>
  <p class="lead">Te sugerimos estas a partir de los datos de tu invitación.</p>
  <div class="opt on"><span class="dot"></span><div><b>invitame.mx/i/valentina-xv</b><br><span>Disponible</span></div></div>
  <div class="opt"><span class="dot"></span><div><b>invitame.mx/i/xv-valentina-2026</b><br><span>Disponible</span></div></div>
  <div class="opt"><span class="dot"></span><div><b>invitame.mx/i/valentina-ramirez</b><br><span>Disponible</span></div></div>
  <a class="own" href="#">Escribir otra dirección</a>
</main>
</body>
</html>
