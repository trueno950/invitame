<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospedaje — lista compacta</title>
<style>
  :root{--bg:#f7ede8;--surface:#fffaf7;--soft:#f1dfd6;--ink:#3d2b28;--accent:#9b5a4f;--deco:#d8b59a;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:#e9e3df;font-family:var(--font-sans);color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:24px}
  .phone{width:390px;background:var(--bg);border-radius:28px;box-shadow:0 30px 60px -30px rgb(0 0 0/40%);padding:20px}
  .card{background:var(--surface);border-radius:20px;padding:22px 20px;box-shadow:inset 0 0 0 1px var(--soft)}
  h2{font-family:var(--font-display);font-weight:600;font-size:28px;text-align:center;margin:0 0 12px}
  .row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--soft)}
  .row div{flex:1}.row b{font-size:15px;display:block}.row span{font-size:12px;color:#6d5752}
  .row a{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}
  .note{margin:14px 0 0;font-size:13px;color:#6d5752;background:var(--bg);border-radius:12px;padding:10px 12px}
  .note b{color:var(--ink)}
</style>
</head>
<body>
<div class="phone">
  <section class="card">
    <h2>Hospedaje y transporte</h2>
    <div class="row"><div><b>Hotel Misión</b><span>A 5 min · código BODA-AYL · desde $1,450</span></div><a href="#">Reservar ↗</a></div>
    <div class="row"><div><b>City Express</b><span>A 12 min · desde $980</span></div><a href="#">Reservar ↗</a></div>
    <p class="note"><b>Transporte:</b> camión del hotel Misión al salón a las 19:00 y de regreso a la 1:00. Estacionamiento gratuito en el salón.</p>
  </section>
</div>
</body>
</html>
