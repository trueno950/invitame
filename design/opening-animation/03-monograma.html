<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apertura — monograma que se desvanece</title>
<style>
  :root{--bg:#f7ede8;--surface:#fffaf7;--soft:#f1dfd6;--ink:#3d2b28;--accent:#9b5a4f;--deco:#d8b59a;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-script:"Great Vibes","Snell Roundhand",cursive;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:#e9e3df;font-family:var(--font-sans);display:grid;place-items:center;min-height:100vh;padding:24px}
  .phone{width:390px;height:760px;background:var(--bg);border-radius:28px;box-shadow:0 30px 60px -30px rgb(0 0 0/40%);position:relative;overflow:hidden;display:grid;place-items:center;text-align:center}
  .inside{animation:in 1.2s 2s both}
  .inside p{margin:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
  .inside b{font-family:var(--font-script);font-size:56px;color:var(--accent);font-weight:400}
  .cover{position:absolute;inset:0;background:var(--surface);display:grid;place-items:center;animation:out 1s 1.6s both}
  .ring{width:150px;height:150px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--deco);display:grid;place-items:center;animation:draw 1.4s both}
  .ring span{font-family:var(--font-display);font-size:52px;color:var(--accent)}
  @keyframes draw{from{transform:scale(.8);opacity:0}}@keyframes out{to{opacity:0;visibility:hidden}}@keyframes in{from{opacity:0;transform:translateY(12px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.cover{display:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="inside"><p>Mis XV años</p><b>Valentina</b></div>
  <div class="cover" aria-hidden="true"><div class="ring"><span>V</span></div></div>
</div>
</body>
</html>
