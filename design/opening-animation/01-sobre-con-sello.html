<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apertura — sobre con sello</title>
<style>
  :root{--bg:#f7ede8;--surface:#fffaf7;--soft:#f1dfd6;--ink:#3d2b28;--accent:#9b5a4f;--deco:#d8b59a;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-script:"Great Vibes","Snell Roundhand",cursive;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:#e9e3df;font-family:var(--font-sans);color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:24px}
  .phone{width:390px;height:760px;background:var(--bg);border-radius:28px;box-shadow:0 30px 60px -30px rgb(0 0 0/40%);position:relative;overflow:hidden;display:grid;place-items:center}
  .card{position:absolute;inset:120px 40px;background:var(--surface);border-radius:12px;display:grid;place-items:center;text-align:center;box-shadow:inset 0 0 0 1px var(--soft);animation:rise 1.2s 1.4s cubic-bezier(.23,1,.32,1) both}
  .card p{margin:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
  .card b{font-family:var(--font-script);font-size:52px;color:var(--accent);font-weight:400}
  .env{position:absolute;left:30px;right:30px;bottom:150px;height:220px;background:#ead6cb;border-radius:10px;animation:drop 1s 2.4s ease-in both}
  .flap{position:absolute;left:30px;right:30px;bottom:270px;height:110px;background:#e2c8ba;clip-path:polygon(0 100%,50% 0,100% 100%);transform-origin:bottom;animation:open .9s .4s ease-in-out both}
  .seal{position:absolute;bottom:300px;left:50%;width:62px;height:62px;margin-left:-31px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-size:24px;animation:fade .4s .2s both reverse}
  .tap{position:absolute;bottom:60px;font-size:13px;color:#6d5752}
  @keyframes open{to{transform:rotateX(180deg)}}
  @keyframes rise{from{transform:translateY(240px);opacity:0}to{transform:none;opacity:1}}
  @keyframes drop{to{transform:translateY(420px);opacity:0}}
  @keyframes fade{to{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.env,.flap,.seal{display:none}.card{opacity:1}}
</style>
</head>
<body>
<div class="phone">
  <div class="card"><div><p>Mis XV años</p><b>Valentina</b></div></div>
  <div class="env" aria-hidden="true"></div><div class="flap" aria-hidden="true"></div>
  <div class="seal" aria-hidden="true">V</div>
  <span class="tap">Toca para abrir</span>
</div>
</body>
</html>
