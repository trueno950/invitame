<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apertura — telón</title>
<style>
  :root{--bg:#f7ede8;--surface:#fffaf7;--soft:#f1dfd6;--ink:#3d2b28;--accent:#9b5a4f;--deco:#d8b59a;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-script:"Great Vibes","Snell Roundhand",cursive;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:#e9e3df;font-family:var(--font-sans);display:grid;place-items:center;min-height:100vh;padding:24px}
  .phone{width:390px;height:760px;background:var(--bg);border-radius:28px;box-shadow:0 30px 60px -30px rgb(0 0 0/40%);position:relative;overflow:hidden;display:grid;place-items:center;text-align:center}
  .inside p{margin:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
  .inside b{font-family:var(--font-script);font-size:56px;color:var(--accent);font-weight:400}
  .l,.r{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,var(--accent) 0 18px,#8a4c42 18px 36px)}
  .l{left:0;animation:left 1.6s .8s cubic-bezier(.65,0,.35,1) both}.r{right:0;animation:right 1.6s .8s cubic-bezier(.65,0,.35,1) both}
  .mono{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90px;height:90px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-size:36px;animation:out .5s .5s both}
  @keyframes left{to{transform:translateX(-100%)}}@keyframes right{to{transform:translateX(100%)}}@keyframes out{to{opacity:0;transform:translate(-50%,-50%) scale(.6)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.l,.r,.mono{display:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="inside"><p>Nuestra boda</p><b>Ana &amp; Luis</b></div>
  <div class="l" aria-hidden="true"></div><div class="r" aria-hidden="true"></div>
  <div class="mono" aria-hidden="true">A&amp;L</div>
</div>
</body>
</html>
