<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa de regalos — sobre y lista</title>
<style>
  :root{--bg:#f7ede8;--surface:#fffaf7;--soft:#f1dfd6;--ink:#3d2b28;--accent:#9b5a4f;--deco:#d8b59a;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:#e9e3df;font-family:var(--font-sans);color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:24px}
  .phone{width:390px;background:var(--bg);border-radius:28px;box-shadow:0 30px 60px -30px rgb(0 0 0/40%);padding:20px}
  .card{background:var(--surface);border-radius:20px;padding:26px 22px;box-shadow:inset 0 0 0 1px var(--soft);text-align:center}
  .env{width:86px;height:58px;margin:0 auto 10px;position:relative;border:1.5px solid var(--accent);border-radius:6px}
  .env::before{content:"";position:absolute;left:0;right:0;top:0;height:30px;border-bottom:1.5px solid var(--accent);clip-path:polygon(0 0,50% 100%,100% 0)}
  h2{font-family:var(--font-display);font-weight:600;font-size:30px;margin:0 0 6px}
  p{font-size:14px;color:#6d5752;margin:0 0 16px}
  .list{list-style:none;padding:0;margin:0 0 16px;text-align:left}
  .list li{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--soft);font-size:15px}
  .list a{color:var(--accent);font-weight:600;text-decoration:none;font-size:13px}
  details{text-align:left;background:var(--bg);border-radius:14px;padding:4px 14px}
  summary{cursor:pointer;padding:10px 0;font-weight:600;color:var(--accent);font-size:14px}
  .row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0}.row span{color:#6d5752}
</style>
</head>
<body>
<div class="phone">
  <section class="card">
    <div class="env" aria-hidden="true"></div>
    <h2>Lluvia de sobres</h2>
    <p>El día del evento habrá una caja para sobres. También puedes elegir alguna de estas opciones:</p>
    <ul class="list">
      <li>Liverpool <a href="#">Ver mesa ↗</a></li>
      <li>Amazon <a href="#">Ver lista ↗</a></li>
    </ul>
    <details>
      <summary>Datos para transferencia</summary>
      <div class="row"><span>Banco</span><b>BBVA</b></div>
      <div class="row"><span>Titular</span><b>Ana Martínez</b></div>
      <div class="row"><span>CLABE</span><b>0121 8000 1234 5678 90</b></div>
    </details>
  </section>
</div>
</body>
</html>
