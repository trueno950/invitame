<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocasiones — tarjetas ilustradas</title>
<style>
  :root{
    --bg:#ffffff; --surface:#ffffff; --soft:#f7f4f2; --line:#ece4e1;
    --ink:#3b1424; --muted:#6b3a4c; --primary:#8c1c3a; --on-primary:#ffffff;
    --gold:#c29a54;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;
    --font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);line-height:1.5}
  .shell{max-width:1120px;margin:0 auto;padding:28px 32px 80px}
  .head{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
  .head .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--primary)}
  .head h1{font-family:var(--font-display);font-weight:600;font-size:34px;margin:6px 0 2px}
  .head p{color:var(--muted);margin:0;font-size:15px}
  h2{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0 0 4px}
  .hint{color:var(--muted);font-size:14px;margin:0 0 18px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .card{border:1.5px solid var(--line);border-radius:18px;background:var(--surface);padding:18px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
  .card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 10px 26px -16px rgb(140 28 58/35%)}
  .card.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
  .icon{width:56px;height:56px;display:grid;place-items:center;border-radius:14px;background:var(--soft)}
  .icon svg{width:30px;height:30px}
  .name{font-family:var(--font-display);font-size:19px;font-weight:600;text-align:center}
  .count{font-size:12px;color:var(--muted)}
  .card.on .count{color:var(--primary);font-weight:600}
  .foot{margin-top:22px;display:flex;gap:10px;align-items:center}
  .pill{font:500 14px var(--font-sans);border-radius:999px;padding:9px 20px;background:var(--primary);color:var(--on-primary);text-decoration:none}
  .ghost{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary)}
  :focus-visible{outline:3px solid var(--primary);outline-offset:3px}
  @media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="shell">
  <header class="head">
    <div class="eyebrow">Nueva invitación</div>
    <h1>¿Qué vas a celebrar?</h1>
    <p>Elige la ocasión y te mostramos sus diseños.</p>
  </header>

  <section aria-labelledby="ocasion">
    <h2 id="ocasion">Ocasión</h2>
    <p class="hint">Cinco ocasiones, cada una con sus propios diseños.</p>
    <div class="grid">
      <div class="card on" tabindex="0" role="button">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="#8c1c3a" stroke-width="1.6"><path d="M5 20 L12 8 L20 20 Z"/><circle cx="12" cy="8" r="2.4"/><circle cx="5" cy="22" r="1.6"/><circle cx="16" cy="22" r="1.6"/><circle cx="27" cy="22" r="1.6"/></svg></span>
        <span class="name">XV años</span>
        <span class="count">6 diseños</span>
      </div>
      <div class="card" tabindex="0" role="button">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="#c29a54" stroke-width="1.6"><circle cx="12" cy="14" r="6"/><circle cx="20" cy="14" r="6"/><path d="M6 26 l6-6 2 2 4-5 6 6 2 3 Z"/></svg></span>
        <span class="name">Bodas</span>
        <span class="count">6 diseños</span>
      </div>
      <div class="card" tabindex="0" role="button">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="#2c5aa0" stroke-width="1.6"><ellipse cx="10" cy="18" rx="5" ry="6.5"/><ellipse cx="21" cy="18" rx="5" ry="6.5"/><path d="M10 11 c0-3 1-4 2-5 M21 11 c0-3 -1-4 -2-5 M15.5 24 v2"/></svg></span>
        <span class="name">Cumpleaños</span>
        <span class="count">8 diseños</span>
      </div>
      <div class="card" tabindex="0" role="button">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="#6f9a6a" stroke-width="1.6"><path d="M16 24 c-7 0-12-3-12-7 c0-4 5-6 12-6 s12 2 12 6 c0 4-5 7-12 7 Z"/><path d="M16 24 v5 M10 27 l-2 3 M22 27 l2 3"/></svg></span>
        <span class="name">Baby shower</span>
        <span class="count">8 diseños</span>
      </div>
      <div class="card" tabindex="0" role="button">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="#5a86a8" stroke-width="1.6"><path d="M16 6 c3-3 8 0 8 5 v7 c0 4-3 7-8 7 s-8-3-8-7 v-7 c0-5 5-8 8-5 Z"/><path d="M16 12 v6 M13 15 h6"/></svg></span>
        <span class="name">Bautizo</span>
        <span class="count">6 diseños</span>
      </div>
    </div>
  </section>

  <div class="foot">
    <a class="pill" href="#">Continuar →</a>
    <a class="pill ghost" href="#">Volver</a>
  </div>
</main>
</body>
</html>
