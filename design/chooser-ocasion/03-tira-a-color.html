<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocasiones — tira segmentada a color</title>
<style>
  :root{
    --bg:#ffffff; --surface:#ffffff; --line:#ece4e1;
    --ink:#3b1424; --muted:#6b3a4c; --primary:#8c1c3a; --on-primary:#ffffff;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;
    --font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);line-height:1.5}
  .shell{max-width:1120px;margin:0 auto;padding:28px 32px 80px}
  .head{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
  .head .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--primary)}
  .head h1{font-family:var(--font-display);font-weight:600;font-size:34px;margin:6px 0 2px}
  .head p{color:var(--muted);margin:0;font-size:15px}
  h2{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0 0 4px}
  .hint{color:var(--muted);font-size:14px;margin:0 0 18px}
  .strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .seg{border-radius:16px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;border:1.5px solid transparent;transition:transform .12s ease}
  .seg:hover{transform:translateY(-2px)}
  .seg .ic{width:40px;height:40px;border-radius:12px;background:rgb(255 255 255/55%);display:grid;place-items:center;font-size:20px}
  .seg .nm{font-family:var(--font-display);font-size:18px;font-weight:600;color:#fff}
  .seg .ct{font-size:12px;color:rgb(255 255 255/85%)}
  .seg.on{box-shadow:0 0 0 3px #fff,0 0 0 5px rgba(0,0,0,.18)}
  .seg.xv{background:#8c1c3a}
  .seg.boda{background:#c29a54}
  .seg.cum{background:#2c5aa0}
  .seg.baby{background:#6f9a6a}
  .seg.bautizo{background:#5a86a8}
  .foot{margin-top:22px;display:flex;gap:10px}
  .pill{font:500 14px var(--font-sans);border-radius:999px;padding:9px 20px;background:var(--primary);color:var(--on-primary);text-decoration:none}
  .ghost{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary)}
  :focus-visible{outline:3px solid var(--primary);outline-offset:3px}
  @media (max-width:760px){.strip{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="shell">
  <header class="head">
    <div class="eyebrow">Nueva invitación</div>
    <h1>¿Qué vas a celebrar?</h1>
    <p>Elige una ocasión para ver sus diseños.</p>
  </header>

  <section aria-labelledby="ocasion">
    <h2 id="ocasion">Ocasión</h2>
    <p class="hint">Cada ocasión tiene su propio color, para que se distingan de un vistazo.</p>
    <div class="strip">
      <div class="seg xv on" tabindex="0" role="button"><span class="ic" aria-hidden="true">👑</span><span class="nm">XV años</span><span class="ct">6 diseños</span></div>
      <div class="seg boda" tabindex="0" role="button"><span class="ic" aria-hidden="true">💍</span><span class="nm">Bodas</span><span class="ct">6 diseños</span></div>
      <div class="seg cum" tabindex="0" role="button"><span class="ic" aria-hidden="true">🎈</span><span class="nm">Cumpleaños</span><span class="ct">8 diseños</span></div>
      <div class="seg baby" tabindex="0" role="button"><span class="ic" aria-hidden="true">🍼</span><span class="nm">Baby shower</span><span class="ct">8 diseños</span></div>
      <div class="seg bautizo" tabindex="0" role="button"><span class="ic" aria-hidden="true">🕊️</span><span class="nm">Bautizo</span><span class="ct">6 diseños</span></div>
    </div>
  </section>

  <div class="foot">
    <a class="pill" href="#">Continuar →</a>
    <a class="pill ghost" href="#">Volver</a>
  </div>
</main>
</body>
</html>
