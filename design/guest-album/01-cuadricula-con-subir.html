<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Álbum — cuadrícula con subir</title>
<style>
  :root{--bg:#f7ede8;--surface:#fffaf7;--soft:#f1dfd6;--ink:#3d2b28;--accent:#9b5a4f;--deco:#d8b59a;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:#e9e3df;font-family:var(--font-sans);color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:24px}
  .phone{width:390px;background:var(--bg);border-radius:28px;box-shadow:0 30px 60px -30px rgb(0 0 0/40%);padding:20px}
  h2{font-family:var(--font-display);font-weight:600;font-size:30px;text-align:center;margin:0 0 4px}
  .sub{text-align:center;font-size:13px;color:#6d5752;margin:0 0 14px}
  .up{display:block;text-align:center;padding:12px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:15px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .grid span{aspect-ratio:1;border-radius:10px;background:linear-gradient(135deg,var(--soft),var(--deco))}
  .grid span:nth-child(3n){background:linear-gradient(135deg,#e6c9b9,#c99f8a)}
  .count{text-align:center;font-size:13px;color:#6d5752;margin:12px 0 0}
</style>
</head>
<body>
<div class="phone">
  <h2>Nuestras fotos</h2>
  <p class="sub">Comparte las fotos que tomes durante la fiesta</p>
  <a class="up" href="#">📷 Subir mis fotos</a>
  <div class="grid"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <p class="count">48 fotos de 12 invitados · Ver todas</p>
</div>
</body>
</html>
