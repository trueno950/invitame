<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recordatorios — dentro de Asistencia</title>
<style>
  :root{--bg:#fff7f5;--surface:#fff;--rose-50:#fdeef2;--rose-100:#f8d7e0;--ink:#3b1424;--muted:#6b3a4c;--primary:#8c1c3a;--field-border:#a06e7e;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);padding:32px}
  main{max-width:860px;margin:0 auto}
  h1{font-family:var(--font-display);font-weight:600;font-size:30px;margin:0 0 14px}
  .totals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
  .t{background:var(--surface);border-radius:16px;padding:14px;box-shadow:inset 0 0 0 1.5px var(--rose-100)}
  .t b{font-family:var(--font-display);font-size:30px;display:block}.t span{font-size:13px;color:var(--muted)}
  .banner{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--rose-50);border-radius:16px;padding:12px 16px;box-shadow:inset 0 0 0 1px var(--rose-100)}
  .banner span{font-size:14px}.banner small{display:block;color:var(--muted);font-size:12px}
  .pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--field-border);color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<main>
  <h1>Asistencia</h1>
  <div class="totals">
    <div class="t"><b>18</b><span>Confirmaron</span></div>
    <div class="t"><b>2</b><span>No asistirán</span></div>
    <div class="t"><b>3</b><span>Sin respuesta</span></div>
  </div>
  <div class="banner">
    <span>¿Recordamos a los 3 que no han respondido por WhatsApp?<small>Disponible pronto: te avisaremos cuando se active.</small></span>
    <span class="pill">Próximamente</span>
  </div>
</main>
</body>
</html>
