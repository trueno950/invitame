<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contraseña — pantalla del invitado</title>
<style>
  :root{--bg:#f7ede8;--surface:#fffaf7;--soft:#f1dfd6;--ink:#3d2b28;--accent:#9b5a4f;--deco:#d8b59a;--line:#c9a99c;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-script:"Great Vibes","Snell Roundhand",cursive;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:#e9e3df;font-family:var(--font-sans);color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:24px}
  .phone{width:390px;height:760px;background:var(--bg);border-radius:28px;box-shadow:0 30px 60px -30px rgb(0 0 0/40%);display:grid;place-items:center;padding:24px}
  .card{width:100%;background:var(--surface);border-radius:22px;padding:30px 24px;text-align:center;box-shadow:inset 0 0 0 1px var(--soft)}
  .lock{width:54px;height:54px;margin:0 auto 10px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:22px}
  .script{font-family:var(--font-script);font-size:40px;color:var(--accent);margin:0}
  p{font-size:14px;color:#6d5752;margin:6px 0 18px}
  input{width:100%;font:16px var(--font-sans);padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);text-align:center;letter-spacing:.1em;margin-bottom:10px}
  button{width:100%;padding:12px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:600 15px var(--font-sans)}
  small{display:block;margin-top:12px;font-size:12px;color:#6d5752}
</style>
</head>
<body>
<div class="phone">
  <form class="card">
    <div class="lock" aria-hidden="true">🔒</div>
    <p class="script">Ana &amp; Luis</p>
    <p>Esta invitación es privada. Escribe la contraseña que te compartieron.</p>
    <input type="password" placeholder="Contraseña" aria-label="Contraseña">
    <button type="button">Ver invitación</button>
    <small>¿No la tienes? Pídesela a quien te invitó.</small>
  </form>
</div>
</body>
</html>
