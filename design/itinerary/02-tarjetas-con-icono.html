<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itinerario — tarjetas con ícono</title>
<style>
  :root{--bg:#f7ede8;--surface:#fffaf7;--soft:#f1dfd6;--ink:#3d2b28;--accent:#9b5a4f;--deco:#d8b59a;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:#e9e3df;font-family:var(--font-sans);color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:24px}
  .phone{width:390px;background:var(--bg);border-radius:28px;overflow:hidden;box-shadow:0 30px 60px -30px rgb(0 0 0/40%);padding:20px}
  .kicker{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);text-align:center}
  h2{font-family:var(--font-display);font-weight:600;font-size:30px;text-align:center;margin:4px 0 16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .m{background:var(--surface);border-radius:18px;padding:16px 12px;text-align:center;box-shadow:inset 0 0 0 1px var(--soft)}
  .m.wide{grid-column:span 2}
  .ic{width:42px;height:42px;margin:0 auto 8px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
  .ic svg{width:22px;height:22px}
  .time{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--accent)}
  .m b{display:block;font-size:14px;margin-top:2px}.m span{display:block;font-size:12px;color:#6d5752;margin-top:2px}
</style>
</head>
<body>
<div class="phone">
  <div class="kicker">Sábado 15 de agosto</div>
  <h2>Así será el día</h2>
  <div class="grid">
    <div class="m wide"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#9b5a4f" stroke-width="1.6"><path d="M12 3v6M9 6h6M5 21V11l7-4 7 4v10M10 21v-5h4v5"/></svg></div><div class="time">17:00</div><b>Misa</b><span>Parroquia de San Juan</span></div>
    <div class="m"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#9b5a4f" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/></svg></div><div class="time">18:30</div><b>Fotos</b></div>
    <div class="m"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#9b5a4f" stroke-width="1.6"><path d="M7 3h10l-5 8zM12 11v8M8 21h8"/></svg></div><div class="time">19:30</div><b>Cóctel</b></div>
    <div class="m"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#9b5a4f" stroke-width="1.6"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/></svg></div><div class="time">20:30</div><b>Vals</b></div>
    <div class="m"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#9b5a4f" stroke-width="1.6"><path d="M4 11h16M6 11a6 6 0 0 1 12 0M12 5V3M3 15h18"/></svg></div><div class="time">21:00</div><b>Cena</b></div>
    <div class="m wide"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#9b5a4f" stroke-width="1.6"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 15.6 7.1 18.2 8 12.7 4 8.8l5.5-.8z"/></svg></div><div class="time">22:00</div><b>¡A bailar!</b><span>Salón Jardín Las Rosas</span></div>
  </div>
</div>
</body>
</html>
