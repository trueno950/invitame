<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inglés — textos bilingües lado a lado</title>
<style>
  :root{--bg:#f7ede8;--surface:#fffaf7;--soft:#f1dfd6;--ink:#3d2b28;--accent:#9b5a4f;--deco:#d8b59a;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-script:"Great Vibes","Snell Roundhand",cursive;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:#e9e3df;font-family:var(--font-sans);color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:24px}
  .phone{width:390px;background:var(--bg);border-radius:28px;box-shadow:0 30px 60px -30px rgb(0 0 0/40%);padding:20px}
  .cover{text-align:center;padding:24px 10px}
  .cover small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
  .cover small i{display:block;font-style:normal;opacity:.7;margin-top:2px}
  .cover b{display:block;font-family:var(--font-script);font-size:48px;color:var(--accent);font-weight:400}
  .card{background:var(--surface);border-radius:18px;padding:16px;margin-top:10px;box-shadow:inset 0 0 0 1px var(--soft)}
  .card h3{font-family:var(--font-display);font-size:19px;margin:0}.card h3 i{font-style:italic;font-weight:400;color:#6d5752;font-size:16px}
  .card p{margin:6px 0 0;font-size:14px;color:#6d5752}
</style>
</head>
<body>
<div class="phone">
  <div class="cover"><small>Nuestra boda<i>Our wedding</i></small><b>Ana &amp; Luis</b></div>
  <div class="card"><h3>Ceremonia · <i>Ceremony</i></h3><p>Parroquia de San Juan · 17:00 h (5:00 p.m.)</p></div>
  <div class="card"><h3>Confirma tu asistencia · <i>RSVP</i></h3><p>Antes del 1 de agosto · Before August 1</p></div>
</div>
</body>
</html>
