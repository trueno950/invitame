<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libro de firmas — moderación del anfitrión</title>
<style>
  :root{--bg:#fff7f5;--surface:#fff;--rose-50:#fdeef2;--rose-100:#f8d7e0;--ink:#3b1424;--muted:#6b3a4c;--primary:#8c1c3a;--field-border:#a06e7e;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);padding:32px}
  main{max-width:760px;margin:0 auto}
  h1{font-family:var(--font-display);font-weight:600;font-size:30px;margin:0 0 4px}
  .lead{color:var(--muted);margin:0 0 14px}
  .tabs{display:flex;gap:8px;margin-bottom:12px}.tabs span{padding:7px 14px;border-radius:999px;font-size:14px;box-shadow:inset 0 0 0 1px var(--field-border)}.tabs .on{background:var(--primary);color:#fff;box-shadow:none}
  .msg{background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:inset 0 0 0 1.5px var(--rose-100);display:flex;gap:14px;align-items:flex-start}
  .msg div{flex:1}.msg p{margin:0 0 4px}.msg small{color:var(--muted)}
  .msg button{font:600 13px var(--font-sans);padding:8px 14px;border-radius:999px;border:0;background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary)}
</style>
</head>
<body>
<main>
  <h1>Libro de firmas</h1>
  <p class="lead">Los mensajes se publican al momento; puedes ocultar cualquiera que no quieras mostrar.</p>
  <div class="tabs"><span class="on">Visibles · 14</span><span>Ocultos · 1</span></div>
  <div class="msg"><div><p>¡Que este día sea tan hermoso como tú! Te queremos mucho.</p><small>Tía Rosa · hace 2 h</small></div><button type="button">Ocultar</button></div>
  <div class="msg"><div><p>Felicidades por tus XV, nos vemos en la pista 💃</p><small>Sofía y Jorge · ayer</small></div><button type="button">Ocultar</button></div>
</main>
</body>
</html>
