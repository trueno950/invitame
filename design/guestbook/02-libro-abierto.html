<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libro de firmas — libro abierto</title>
<style>
  :root{--bg:#f7ede8;--surface:#fffaf7;--soft:#f1dfd6;--ink:#3d2b28;--accent:#9b5a4f;--deco:#d8b59a;--line:#c9a99c;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-script:"Great Vibes","Snell Roundhand",cursive;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:#e9e3df;font-family:var(--font-sans);color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:24px}
  .phone{width:390px;background:var(--bg);border-radius:28px;box-shadow:0 30px 60px -30px rgb(0 0 0/40%);padding:20px}
  .book{background:var(--surface);border-radius:6px;padding:26px 22px;box-shadow:0 0 0 1px var(--deco),0 0 0 6px var(--surface),0 0 0 7px var(--deco)}
  h2{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:30px;text-align:center;margin:0}
  .rule{width:70px;height:1px;background:var(--deco);margin:10px auto 16px}
  .entry{padding:10px 0;border-bottom:1px dotted var(--deco)}
  .entry p{margin:0 0 4px;font-family:var(--font-display);font-size:17px;font-style:italic;line-height:1.4}
  .entry b{font-family:var(--font-script);font-size:22px;color:var(--accent);font-weight:400}
  .more{display:block;text-align:center;margin:12px 0;color:var(--accent);font-size:13px;font-weight:600}
  .sign{display:block;text-align:center;padding:11px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;text-decoration:none}
</style>
</head>
<body>
<div class="phone">
  <div class="book">
    <h2>Libro de firmas</h2><div class="rule"></div>
    <div class="entry"><p>«Que este día sea tan hermoso como tú.»</p><b>Tía Rosa</b></div>
    <div class="entry"><p>«Felicidades por tus XV, nos vemos en la pista.»</p><b>Sofía y Jorge</b></div>
    <a class="more" href="#">Ver los 14 mensajes</a>
    <a class="sign" href="#">Firmar el libro</a>
  </div>
</div>
</body>
</html>
