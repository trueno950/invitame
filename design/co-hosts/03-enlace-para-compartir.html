<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coanfitriones — enlace para compartir</title>
<style>
  :root{--bg:#fff7f5;--surface:#fff;--rose-50:#fdeef2;--rose-100:#f8d7e0;--ink:#3b1424;--muted:#6b3a4c;--primary:#8c1c3a;--field-border:#a06e7e;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);padding:32px}
  main{max-width:640px;margin:0 auto}
  h1{font-family:var(--font-display);font-weight:600;font-size:28px;margin:0 0 4px}
  .lead{color:var(--muted);margin:0 0 16px}
  .card{background:var(--surface);border-radius:20px;padding:20px;box-shadow:inset 0 0 0 1.5px var(--rose-100)}
  .link{display:flex;gap:8px;align-items:center;background:var(--rose-50);border-radius:14px;padding:10px 12px;margin:8px 0 12px}
  .link code{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .link button{font:600 13px var(--font-sans);padding:8px 14px;border-radius:999px;border:0;background:var(--primary);color:#fff}
  .warn{font-size:13px;color:var(--muted)}
  a{color:var(--primary);font-weight:600;font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Coanfitriones</h1>
  <p class="lead">Comparte este enlace con quien quieras que edite contigo. Necesitará entrar con su correo.</p>
  <section class="card">
    <b>Enlace para coanfitriones</b>
    <div class="link"><code>invitame.mx/unirse/7Kq2-Xr8p-Lm4z</code><button type="button">Copiar</button></div>
    <p class="warn">Caduca en 7 días y sirve para una sola persona. <a href="#">Generar otro</a></p>
  </section>
</main>
</body>
</html>
