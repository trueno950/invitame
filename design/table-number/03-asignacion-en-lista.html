<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa — asignación en la lista de invitados</title>
<style>
  :root{--bg:#fff7f5;--surface:#fff;--rose-50:#fdeef2;--rose-100:#f8d7e0;--ink:#3b1424;--muted:#6b3a4c;--primary:#8c1c3a;--field-border:#a06e7e;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);padding:32px}
  main{max-width:980px;margin:0 auto}
  h1{font-family:var(--font-display);font-weight:600;font-size:32px;margin:0 0 4px}
  p.lead{color:var(--muted);margin:0 0 18px}
  table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--rose-100)}
  th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--rose-100);font-size:14px}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:var(--rose-50)}
  .state{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--field-border)}
  input{width:70px;font:15px var(--font-sans);padding:8px 10px;border-radius:10px;border:1.5px solid var(--field-border);text-align:center}
  .summary{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .summary span{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--rose-50);color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Invitados</h1>
  <p class="lead">Escribe el número de mesa de cada invitado; aparecerá en su pase de acceso.</p>
  <table>
    <thead><tr><th>Invitado</th><th>Lugares</th><th>Respuesta</th><th>Mesa</th></tr></thead>
    <tbody>
      <tr><td>Familia Gómez</td><td>3 de 4</td><td><span class="state">Confirmó</span></td><td><input value="7" aria-label="Mesa de Familia Gómez"></td></tr>
      <tr><td>Tía Rosa</td><td>1 de 1</td><td><span class="state">Confirmó</span></td><td><input value="2" aria-label="Mesa de Tía Rosa"></td></tr>
      <tr><td>Primos Ruiz</td><td>— de 3</td><td><span class="state">Pendiente</span></td><td><input placeholder="—" aria-label="Mesa de Primos Ruiz"></td></tr>
    </tbody>
  </table>
  <div class="summary"><span>Mesa 7 · 3 personas</span><span>Mesa 2 · 1 persona</span><span>Sin mesa · 1 invitado</span></div>
</main>
</body>
</html>
