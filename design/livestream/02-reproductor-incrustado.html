<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>En vivo — reproductor dentro de la invitación</title>
<style>
  :root{--bg:#f7ede8;--surface:#fffaf7;--soft:#f1dfd6;--ink:#3d2b28;--accent:#9b5a4f;--deco:#d8b59a;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:#e9e3df;font-family:var(--font-sans);color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:24px}
  .phone{width:390px;background:var(--bg);border-radius:28px;box-shadow:0 30px 60px -30px rgb(0 0 0/40%);padding:20px}
  .card{background:var(--surface);border-radius:20px;padding:20px;box-shadow:inset 0 0 0 1px var(--soft)}
  h2{font-family:var(--font-display);font-weight:600;font-size:26px;text-align:center;margin:0 0 12px}
  .player{aspect-ratio:16/9;border-radius:14px;background:#2b211f;display:grid;place-items:center;color:#fff;position:relative}
  .player::after{content:"▶";width:56px;height:56px;border-radius:50%;background:rgb(255 255 255/18%);display:grid;place-items:center;font-size:22px}
  .cap{font-size:13px;color:#6d5752;text-align:center;margin:10px 0 0}
</style>
</head>
<body>
<div class="phone">
  <section class="card">
    <h2>Míralo en vivo</h2>
    <div class="player" role="img" aria-label="Reproductor de la transmisión"></div>
    <p class="cap">La transmisión inicia el sábado a las 17:00 h. Si no carga, <a href="#">ábrela aquí</a>.</p>
  </section>
</div>
</body>
</html>
