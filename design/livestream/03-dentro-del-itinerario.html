<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>En vivo — dentro del itinerario</title>
<style>
  :root{--bg:#f7ede8;--surface:#fffaf7;--soft:#f1dfd6;--ink:#3d2b28;--accent:#9b5a4f;--deco:#d8b59a;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:#e9e3df;font-family:var(--font-sans);color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:24px}
  .phone{width:390px;background:var(--bg);border-radius:28px;box-shadow:0 30px 60px -30px rgb(0 0 0/40%);padding:20px}
  .card{background:var(--surface);border-radius:20px;padding:22px;box-shadow:inset 0 0 0 1px var(--soft)}
  h2{font-family:var(--font-display);font-weight:600;font-size:28px;text-align:center;margin:0 0 14px}
  ol{list-style:none;margin:0;padding:0;position:relative}
  ol::before{content:"";position:absolute;left:58px;top:6px;bottom:6px;width:1.5px;background:var(--deco)}
  li{display:grid;grid-template-columns:50px 18px 1fr;gap:10px;padding:10px 0}
  .t{font-family:var(--font-display);font-size:19px;font-weight:600;text-align:right}
  .d{width:13px;height:13px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px var(--accent);margin:4px auto 0;position:relative;z-index:1}
  li:first-child .d{background:var(--accent)}
  li b{display:block;font-size:15px}li span{font-size:13px;color:#6d5752}
  .live{display:inline-flex;margin-top:6px;padding:6px 12px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="phone">
  <section class="card">
    <h2>Itinerario</h2>
    <ol>
      <li><span class="t">17:00</span><span class="d"></span><div><b>Misa</b><span>Parroquia de San Juan</span><br><a class="live" href="#">● Ver en vivo</a></div></li>
      <li><span class="t">19:30</span><span class="d"></span><div><b>Recepción</b><span>Salón Jardín Las Rosas</span></div></li>
      <li><span class="t">21:00</span><span class="d"></span><div><b>Cena</b></div></li>
    </ol>
  </section>
</div>
</body>
</html>
