<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmación — tarjeta por persona</title>
<style>
  :root{--bg:#f7ede8;--surface:#fffaf7;--soft:#f1dfd6;--ink:#3d2b28;--accent:#9b5a4f;--deco:#d8b59a;--line:#c9a99c;
    --font-display:"Cormorant Garamond","Iowan Old Style",Palatino,serif;--font-sans:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:#e9e3df;font-family:var(--font-sans);color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:24px}
  .phone{width:390px;background:var(--bg);border-radius:28px;box-shadow:0 30px 60px -30px rgb(0 0 0/40%);padding:20px}
  h2{font-family:var(--font-display);font-weight:600;font-size:28px;text-align:center;margin:0 0 4px}
  .sub{text-align:center;font-size:13px;color:#6d5752;margin:0 0 14px}
  .p{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:inset 0 0 0 1px var(--soft)}
  .p .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .p b{font-size:14px}.tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--soft);padding:3px 8px;border-radius:999px}
  input,select{width:100%;font:15px var(--font-sans);padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;margin-top:6px}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .add{width:100%;padding:11px;border-radius:999px;border:1.5px dashed var(--accent);background:transparent;color:var(--accent);font:600 14px var(--font-sans);margin-bottom:10px}
  .send{width:100%;padding:12px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:600 15px var(--font-sans)}
</style>
</head>
<body>
<div class="phone">
  <h2>Confirma tu asistencia</h2>
  <p class="sub">Lugares para 4 personas · 2 de 4 agregadas</p>
  <div class="p"><div class="top"><b>Tú</b><span class="tag">Adulto</span></div>
    <input value="Laura Gómez"><div class="row"><select><option>Sin restricción</option></select></div></div>
  <div class="p"><div class="top"><b>Acompañante 1</b><span class="tag">Niño</span></div>
    <input value="Sofía Gómez"><div class="row"><select><option>Niño · 8 años</option></select><select><option>Alergia a la nuez</option></select></div></div>
  <button class="add" type="button">＋ Agregar acompañante</button>
  <button class="send" type="button">Confirmar 2 personas</button>
</div>
</body>
</html>
