services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: invitame
      POSTGRES_USER: invitame
      POSTGRES_PASSWORD: invitame_local_only
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      # PostgreSQL 17 cannot read PostgreSQL 16 data files, so it uses its own volume.
      # Old PostgreSQL 16 data is not migrated automatically; run `pnpm db:migrate` and `pnpm db:seed`.
      - invitame_postgres_data_pg17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invitame -d invitame"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invitame_postgres_data_pg17:
