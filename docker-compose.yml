services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: invitame
      POSTGRES_USER: invitame
      POSTGRES_PASSWORD: invitame_local_only
    ports:
      - "5442:5432"
    volumes:
      - invitame_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invitame -d invitame"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invitame_postgres_data:
