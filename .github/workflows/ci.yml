name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Documentation consistency
        run: pnpm docs:check

      - name: Generate Prisma client
        run: pnpm --filter @invitame/api prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Diff hygiene
        run: git diff --check

  database-tests:
    name: Database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # A disposable service reachable only from this job, so no password is stored here.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: invitame_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invitame_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The database suites refuse any host that is not local (apps/api/test/database.ts).
      DATABASE_URL: postgresql://postgres@localhost:5432/invitame_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @invitame/api prisma:generate

      - name: Apply migrations
        run: pnpm --filter @invitame/api prisma:migrate:deploy

      - name: Database integration tests
        run: pnpm --filter @invitame/api test:db

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # A disposable service reachable only from this job, so no password is stored here.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: invitame_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invitame_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports:
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # The harness refuses any host that is not local (apps/web/e2e/support/environment.ts) and
      # generates the API and proxy secrets itself for each run (apps/web/playwright.config.ts).
      E2E_DATABASE_URL: postgresql://postgres@localhost:5432/invitame_e2e
      E2E_MAILPIT_URL: http://localhost:8025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @invitame/api prisma:generate

      - name: Apply migrations
        run: pnpm --filter @invitame/api prisma:migrate:deploy
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @invitame/web test:e2e:install --with-deps

      - name: Browser tests
        run: pnpm --filter @invitame/web test:e2e

      # Screenshots and traces of failed tests only; the server output is already in the job log.
      # A trace records the failed test's pages and the browser's requests and responses, so it can
      # hold that run's test addresses, initial passwords, sign-in codes, TOTP setup keys, backup
      # codes, and session cookies. They work only against this job's database, which ends with the
      # job, and the API and proxy secrets never reach the browser. Kept for one day only
      # (R1-ci-failure-artifact-holds-test-credentials).
      - name: Upload browser test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 1
